# MetricFlow attempts, blind round (dbt-metricflow 0.15.0, metricflow 0.213.0)
# Same facts as attempts.yaml: no query-time arithmetic (ratios, differences, offsets, windows,
# shares, ranking, nested aggregation); MAX_JOIN_HOPS = 2 (customer_nation_name is 3 hops and
# customer_region_name 4 hops from lineitem, supplier_region_name 3 hops); metric filters take only
# entities as group_by and do not inherit the outer where. customer_count, supplier_count and
# total_available_qty were first dropped in translation (no aggregation time dimension); since the
# translation fix of 2026-11-10 they are emitted with a NULL plumbing agg_time dimension, and the
# affected entries below were re-tested.
# Multi-hop dimensions inside a where filter use entity_path (see B43).

