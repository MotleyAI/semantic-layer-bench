# anfra (AMQL) blind-round attempts. Query text is the exact AQL passed to `anfra query -d tpch`.
# strict: the query expresses the question exactly (incl. tie-breaks) with no reliance on this data.
- id: B01
  status: attempted
  interface: aql
  query: |
    explore {
      dimensions { ship_mode: lineitem.ship_mode }
      measures {
        line_count: line_count,
        late_share: (lineitem | count_if(lineitem.receipt_date > lineitem.commit_date)) / line_count,
      }
      sorts { ship_mode asc }
    }
  columns:
    ship_mode: ship_mode
    line_count: line_count
    late_share: late_share
  strict: true
- id: B02
  status: attempted
  interface: aql
  query: |
    explore {
      dimensions { supplier_region_name: supplier_region.supplier_region_name }
      measures {
        returned_share: (lineitem | count_if(lineitem.return_flag == 'R')) / line_count,
      }
      sorts { supplier_region_name asc }
    }
  columns:
    supplier_region_name: supplier_region_name
    returned_share: returned_share
  strict: true
- id: B03
