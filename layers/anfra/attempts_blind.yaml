      sorts { manufacturer asc }
    }
  columns:
    manufacturer: manufacturer
    cheapest_source_qty_share: cheapest_source_qty_share
  strict: false
  notes: The model declares no part key, so a part is identified by part_name + manufacturer when taking the minimum
    supply_cost per part. Correct because that pair is unique over all 200,000 parts in this data (same caveat as
    SLayer).
