    measures:
      - {formula: "sum(iif(order_date in '1996', total_price, 0)) / sum(iif(order_date in '1996', 1, 0))", name: avg_order_value_1996}
      - {formula: "sum(iif(order_date in '1997', total_price, 0)) / sum(iif(order_date in '1997', 1, 0))", name: avg_order_value_1997}
      - {formula: "sum(iif(order_date in '1997', total_price, 0)) / sum(iif(order_date in '1997', 1, 0)) - sum(iif(order_date in '1996', total_price, 0)) / sum(iif(order_date in '1996', 1, 0))", name: avg_order_value_change}
    filters:
      - "order_date >= '1996'"
      - "order_date <= '1997'"
      - "sum(iif(order_date in '1996', 1, 0)) >= 100"
      - "sum(iif(order_date in '1997', 1, 0)) >= 100"
    order:
      - {column: avg_order_value_change, direction: desc}
      - {column: clerk, direction: asc}
    limit: 10
  columns:
    clerk: orders.clerk
    avg_order_value_1996: orders.avg_order_value_1996
    avg_order_value_1997: orders.avg_order_value_1997
    avg_order_value_change: orders.avg_order_value_change

