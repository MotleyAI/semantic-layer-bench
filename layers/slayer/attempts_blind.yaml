  query:
    source_model: lineitem
    dimensions: [part.brand]
    measures: [revenue]
    filters: ["orders.order_date in '1997'", "orders.customer.market_segment == 'AUTOMOBILE'"]
    order:
      - {column: revenue, direction: desc}
      - {column: part.brand, direction: asc}
    limit: 5
  columns: {brand: lineitem.part.brand, revenue: lineitem.revenue}

- id: B44
  status: attempted
