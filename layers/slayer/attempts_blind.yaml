    dimensions: [supplier.supplier_nation.supplier_region.supplier_region_name]
    measures:
      - revenue
      - {formula: "revenue - sum(partsupp.supply_cost * quantity)", name: margin}
      - {formula: "(revenue - sum(partsupp.supply_cost * quantity)) / revenue", name: margin_rate}
    filters: ["orders.order_date in '1997'"]
  columns:
    supplier_region_name: lineitem.supplier.supplier_nation.supplier_region.supplier_region_name
    revenue: lineitem.revenue
    margin: lineitem.margin
    margin_rate: lineitem.margin_rate

- id: B25
