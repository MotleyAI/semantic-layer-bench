# SLayer 1.7.0 attempts, blind round (B01..B50). Only model-declared fields and metrics are
# referenced (dataset fields such as ship_date, commit_date, customer_key; metrics such as revenue).
# Physical columns that the OSSIE import also exposes (l_suppkey, o_custkey, ...) are never used.

- id: B01
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [ship_mode]
    measures:
      - line_count
      - {formula: "avg(iif(receipt_date > commit_date, 1.0, 0.0))", name: late_share}
  columns: {ship_mode: lineitem.ship_mode, line_count: lineitem.line_count, late_share: lineitem.late_share}

- id: B02
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [supplier.supplier_nation.supplier_region.supplier_region_name]
    measures:
      - {formula: "avg(iif(return_flag == 'R', 1.0, 0.0))", name: returned_share}
  columns:
    supplier_region_name: lineitem.supplier.supplier_nation.supplier_region.supplier_region_name
    returned_share: lineitem.returned_share

- id: B03
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [ship_mode]
    measures: [total_quantity]
    filters: ["ship_date in '1997'"]
  columns: {ship_mode: lineitem.ship_mode, total_quantity: lineitem.total_quantity}

- id: B04
  status: attempted
  interface: query
  query:
    source_model: partsupp
    dimensions: [supplier.supplier_nation.supplier_region.supplier_region_name]
    measures: [total_available_qty]
  columns:
    supplier_region_name: partsupp.supplier.supplier_nation.supplier_region.supplier_region_name
    total_available_qty: partsupp.total_available_qty

- id: B05
  status: attempted
  interface: query
  query: {source_model: orders, dimensions: [order_status], measures: [order_count]}
  columns: {order_status: orders.order_status, order_count: orders.order_count}

- id: B06
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [ship_mode]
    measures: [{formula: "avg(date_diff('day', ship_date, receipt_date))", name: avg_transit_days}]
    filters: ["ship_date in '1997'"]
  columns: {ship_mode: lineitem.ship_mode, avg_transit_days: lineitem.avg_transit_days}

- id: B07
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [supplier.supplier_name]
    measures:
      - line_count
      - {formula: "avg(iif(receipt_date > commit_date, 1.0, 0.0))", name: late_share}
    filters: ["receipt_date >= '1996'", "receipt_date <= '1997'", "line_count >= 100"]
    order:
      - {column: late_share, direction: desc}
      - {column: supplier.supplier_name, direction: asc}
    limit: 10
  columns:
    supplier_name: lineitem.supplier.supplier_name
    line_count: lineitem.line_count
    late_share: lineitem.late_share

- id: B08
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [orders.order_priority]
    measures:
      - line_count
      - {formula: "avg(iif(receipt_date > commit_date, 1.0, 0.0))", name: late_share}
    filters: ["orders.order_date in '1995'"]
  columns:
    order_priority: lineitem.orders.order_priority
    line_count: lineitem.line_count
    late_share: lineitem.late_share

- id: B09
  status: attempted
  interface: query
  query:
    source_model: lineitem
    time_dimensions: [{dimension: ship_date, granularity: month, date_range: "1997"}]
    measures:
      - {formula: "avg(iif(receipt_date > commit_date, 1.0, 0.0))", name: late_share}
  columns: {ship_month: lineitem.ship_date, late_share: lineitem.late_share}

- id: B10
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [part.manufacturer]
    measures:
      - {formula: "sum(iif(return_flag == 'R', quantity, 0)) / total_quantity", name: returned_qty_share}
    filters: ["receipt_date in '1994'"]
  columns: {manufacturer: lineitem.part.manufacturer, returned_qty_share: lineitem.returned_qty_share}

- id: B11
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [supplier.supplier_nation.supplier_nation_name]
    measures:
      - {formula: line_count, name: late_line_count}
      - {formula: "avg(date_diff('day', commit_date, receipt_date))", name: avg_days_late}
    filters: ["ship_date in '1996'", "receipt_date > commit_date"]
  columns:
    supplier_nation_name: lineitem.supplier.supplier_nation.supplier_nation_name
    late_line_count: lineitem.late_line_count
    avg_days_late: lineitem.avg_days_late

- id: B12
  status: attempted
  interface: query
  query:
    source_model: part
    dimensions: [part_type]
    measures:
      - partsupp.total_available_qty
      - {formula: "sum(iif(lineitem.orders.order_date in '1997', lineitem.quantity, 0))", name: total_quantity_1997}
      - {formula: "partsupp.total_available_qty / sum(iif(lineitem.orders.order_date in '1997', lineitem.quantity, 0))", name: cover_ratio}
    filters: ["part_type like '%BRASS%'"]
  columns:
    part_type: part.part_type
    total_available_qty: part.partsupp.total_available_qty
    total_quantity_1997: part.total_quantity_1997
    cover_ratio: part.cover_ratio

- id: B13
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [ship_mode]
    measures:
      - {formula: line_count, name: late_line_count}
      - {formula: "avg(iif(ship_date > commit_date, 1.0, 0.0))", name: shipped_late_share}
      - {formula: "avg(iif(ship_date <= commit_date, 1.0, 0.0))", name: transit_late_share}
    filters: ["ship_date in '1997'", "receipt_date > commit_date"]
  columns:
    ship_mode: lineitem.ship_mode
    late_line_count: lineitem.late_line_count
    shipped_late_share: lineitem.shipped_late_share
    transit_late_share: lineitem.transit_late_share

- id: B14
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [supplier.supplier_name]
    measures:
      - {formula: "sum(iif(ship_date in '1995' and receipt_date > commit_date, 1.0, 0.0)) / sum(iif(ship_date in '1995', 1.0, 0.0))", name: late_share_1995}
      - {formula: "sum(iif(ship_date in '1996' and receipt_date > commit_date, 1.0, 0.0)) / sum(iif(ship_date in '1996', 1.0, 0.0))", name: late_share_1996}
      - {formula: "sum(iif(ship_date in '1996' and receipt_date > commit_date, 1.0, 0.0)) / sum(iif(ship_date in '1996', 1.0, 0.0)) - sum(iif(ship_date in '1995' and receipt_date > commit_date, 1.0, 0.0)) / sum(iif(ship_date in '1995', 1.0, 0.0))", name: late_share_change}
    filters:
      - "ship_date >= '1995'"
      - "ship_date <= '1996'"
      - "sum(iif(ship_date in '1995', 1, 0)) >= 50"
      - "sum(iif(ship_date in '1996', 1, 0)) >= 50"
    order:
      - {column: late_share_change, direction: desc}
      - {column: supplier.supplier_name, direction: asc}
    limit: 10
  columns:
    supplier_name: lineitem.supplier.supplier_name
    late_share_1995: lineitem.late_share_1995
    late_share_1996: lineitem.late_share_1996
    late_share_change: lineitem.late_share_change

- id: B15
  status: attempted
  interface: query
  query:
    - name: per_order
      source_model: lineitem
      dimensions: [orders.order_key]
      measures: [{formula: "sum(iif(receipt_date > commit_date, 1, 0))", name: late_lines}]
      filters: ["orders.order_status == 'F'", "orders.order_date in '1994'"]
    - source_model: per_order
      dimensions: [late_lines]
      measures: [{formula: "count(*)", name: order_count}]
  columns: {late_lines_in_order: per_order.late_lines, order_count: per_order.order_count}

- id: B16
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions:
      - supplier.supplier_nation.supplier_region.supplier_region_name
      - supplier.supplier_nation.supplier_nation_name
    measures:
      - {formula: "avg(iif(receipt_date > commit_date, 1.0, 0.0))", name: late_share}
    filters:
      - "ship_date in '1997'"
      - "rank(avg(iif(receipt_date > commit_date, 1.0, 0.0)), partition_by=supplier.supplier_nation.supplier_region.supplier_region_name, direction='desc') == 1"
  columns:
    supplier_region_name: lineitem.supplier.supplier_nation.supplier_region.supplier_region_name
    supplier_nation_name: lineitem.supplier.supplier_nation.supplier_nation_name
    late_share: lineitem.late_share

- id: B17
  status: attempted
  interface: query
  query:
    - name: min_cost
      source_model: partsupp
      dimensions: [part.part_name, part.manufacturer]
      measures: [{formula: "min(supply_cost)", name: min_supply_cost}]
    - name: offer_lines
      source_model: lineitem
      dimensions: [part.part_name, part.manufacturer, partsupp.supply_cost]
      measures: [total_quantity]
      filters: ["ship_date in '1997'"]
    - source_model:
        source_name: offer_lines
        joins:
          - target_model: min_cost
            join_pairs: [[part__part_name, part__part_name], [part__manufacturer, part__manufacturer]]
            cardinality: many_to_one
      dimensions: [part__manufacturer]
      measures:
        - {formula: "sum(iif(partsupp__supply_cost == min_cost.min_supply_cost, total_quantity, 0)) / sum(total_quantity)", name: cheapest_source_qty_share}
  columns:
    manufacturer: offer_lines.part__manufacturer
    cheapest_source_qty_share: offer_lines.cheapest_source_qty_share
  notes: >
    The model declares no part key, so a part is identified by part_name + manufacturer (unique
    over all 200,000 parts). min_cost takes the minimum over every supplier offer of the part.

- id: B18
  status: attempted
  interface: query
