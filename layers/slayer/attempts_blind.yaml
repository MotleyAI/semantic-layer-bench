    dimensions: [part.brand]
    measures:
      - {formula: "avg(iif(extended_price * (1 - discount) - partsupp.supply_cost * quantity < 0, 1.0, 0.0))", name: below_cost_line_share}
      - {formula: "sum(iif(extended_price * (1 - discount) - partsupp.supply_cost * quantity < 0, extended_price * (1 - discount) - partsupp.supply_cost * quantity, 0))", name: below_cost_margin}
    filters: ["orders.order_date in '1997'"]
  columns:
    brand: lineitem.part.brand
    below_cost_line_share: lineitem.below_cost_line_share
    below_cost_margin: lineitem.below_cost_margin

- id: B33
