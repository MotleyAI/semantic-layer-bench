- id: B26
  status: attempted
  interface: query
  query:
    source_model: lineitem
    time_dimensions: [{dimension: orders.order_date, granularity: month, date_range: "1997"}]
    measures: [revenue]
  columns: {order_month: lineitem.orders.order_date, revenue: lineitem.revenue}

- id: B27
