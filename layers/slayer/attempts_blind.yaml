- id: B29
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [orders.customer.customer_nation.customer_region.customer_region_name]
    measures:
      - {formula: "sum(iif(orders.order_date >= '1997-01' and orders.order_date <= '1997-06', extended_price * (1 - discount), 0))", name: revenue_h1_1997}
      - {formula: "sum(iif(orders.order_date >= '1998-01' and orders.order_date <= '1998-06', extended_price * (1 - discount), 0))", name: revenue_h1_1998}
      - {formula: "sum(iif(orders.order_date >= '1998-01' and orders.order_date <= '1998-06', extended_price * (1 - discount), 0)) / sum(iif(orders.order_date >= '1997-01' and orders.order_date <= '1997-06', extended_price * (1 - discount), 0)) - 1", name: revenue_growth}
    filters: ["orders.order_date >= '1997-01'", "orders.order_date <= '1998-06'"]
  columns:
    customer_region_name: lineitem.orders.customer.customer_nation.customer_region.customer_region_name
    revenue_h1_1997: lineitem.revenue_h1_1997
    revenue_h1_1998: lineitem.revenue_h1_1998
    revenue_growth: lineitem.revenue_growth

- id: B30
  status: attempted
  interface: query
  query:
    - name: per_customer
      source_model: lineitem
      dimensions: [orders.customer_key]
      measures:
        - revenue
        - {formula: "rank(revenue, direction='desc')", name: revenue_rank}
      filters: ["orders.order_date in '1997'"]
    - source_model: per_customer
      measures:
        - {formula: "sum(iif(revenue_rank <= 100, revenue, 0))", name: top100_revenue}
        - {formula: "sum(revenue)", name: total_revenue}
        - {formula: "sum(iif(revenue_rank <= 100, revenue, 0)) / sum(revenue)", name: top100_share}
  columns:
    top100_revenue: per_customer.top100_revenue
    total_revenue: per_customer.total_revenue
    top100_share: per_customer.top100_share

- id: B31
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [orders.customer.market_segment, orders.customer.customer_nation.customer_nation_name]
    measures:
      - revenue
      - {formula: "revenue / sum(extended_price * (1 - discount), partition_by=orders.customer.market_segment)", name: segment_revenue_share}
      - {formula: "rank(revenue, partition_by=orders.customer.market_segment, direction='desc')", name: rank_in_segment}
    filters: ["orders.order_date in '1997'", "rank_in_segment <= 3"]
    order:
      - {column: orders.customer.market_segment, direction: asc}
      - {column: rank_in_segment, direction: asc}
  columns:
    market_segment: lineitem.orders.customer.market_segment
    customer_nation_name: lineitem.orders.customer.customer_nation.customer_nation_name
    revenue: lineitem.revenue
    segment_revenue_share: lineitem.segment_revenue_share
    rank_in_segment: lineitem.rank_in_segment

- id: B32
  status: attempted
