    source_model: orders
    dimensions: [order_priority]
    measures: [avg_order_value]
    filters: ["order_date in '1997'"]
  columns: {order_priority: orders.order_priority, avg_order_value: orders.avg_order_value}

- id: B22
  status: attempted
  interface: query
  query:
    source_model: lineitem
    dimensions: [orders.customer.customer_nation.customer_region.customer_region_name]
    measures: [revenue]
    filters: ["orders.order_date in '1997'"]
  columns:
    customer_region_name: lineitem.orders.customer.customer_nation.customer_region.customer_region_name
