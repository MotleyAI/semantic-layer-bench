    source_model: lineitem
    time_dimensions: [{dimension: orders.order_date, granularity: year, date_range: ["1993", "1997"]}]
    measures:
      - revenue
      - {formula: "revenue / time_shift(revenue, -1) - 1", name: revenue_growth}
  columns: {order_year: lineitem.orders.order_date, revenue: lineitem.revenue, revenue_growth: lineitem.revenue_growth}

- id: B24
