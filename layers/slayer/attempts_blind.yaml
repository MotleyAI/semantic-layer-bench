    measures:
      - {formula: "sum(iif(return_flag == 'R', extended_price * (1 - discount), 0))", name: returned_revenue}
      - {formula: "sum(iif(return_flag == 'R', extended_price * (1 - discount), 0)) / revenue", name: returned_revenue_share}
