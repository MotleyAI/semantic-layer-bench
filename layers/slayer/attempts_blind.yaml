        - {expression: "iif(lifetime_orders < 10, '1-9', iif(lifetime_orders < 15, '10-14', iif(lifetime_orders < 20, '15-19', iif(lifetime_orders < 25, '20-24', '25+'))))", name: order_count_bucket}
      measures:
