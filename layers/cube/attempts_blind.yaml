# Cube 1.6.76 attempts, blind round (B01..B50). Same conventions as attempts.yaml:
# interface: rest = one Cube REST /v1/load query object.
# interface: sql = Postgres-wire SQL API; counted only when `EXPLAIN` shows a bare
# `CubeScan: request={...}`. Plans with a DataFusion Projection/Aggregate/Window over the CubeScan
# (post-processing) or `CubeScanWrappedSql` (SQL pushdown of ad-hoc SQL) do not count.
# All "SQL API" tries below were run through EXPLAIN on port 15432; the quoted plan heads are what
# Cube returned.
#
# Recurring limits of the frozen model + Cube query API:
#  - No query-time calculated measures in REST (ratios, differences between measures).
#  - No per-measure filters at query time (conditional counts/sums such as "late lines").
#  - No member-vs-member filters (receipt_date > commit_date); no segments in the model.
#  - No ad-hoc aggregation of dimensions (supply_cost * quantity, date differences).
#  - No windows / ranks / time shifts / multi-stage measures at query time; compareDateRange on
#    /v1/load answers "'compareDateRangeQuery' query type is not supported by the client" and with
#    queryType=multi returns separate result sets (combining them is post-processing).

# ================================================================ OPERATIONS
- id: B01
  status: unsupported
  reason: >
    late_share needs a conditional count (receipt_date > commit_date) divided by line_count. The
    REST query has no member-vs-member filter, no per-measure filter and no calculated measure.
    line_count by ship_mode alone is one REST query; the share is not.
  category: expressivity
  fixable_in_model: yes
  tried:
    - query: "SQL API: SELECT ship_mode, MEASURE(line_count) FROM lineitem GROUP BY 1"
      error: "Plain CubeScan (counts) - but only the line_count column."
    - query: "SQL API: SELECT ship_mode, MEASURE(line_count), AVG(CASE WHEN receipt_date > commit_date THEN 1.0 ELSE 0.0 END) FROM lineitem GROUP BY 1"
      error: "EXPLAIN -> CubeScanWrappedSql (generated SQL computes AVG(CASE WHEN l_receiptdate > l_commitdate ...)): SQL pushdown over an undeclared expression, does not count."
    - note: "A segment or boolean dimension is_late plus a filtered count measure and a ratio measure in the model would fix it."

