cubes:
  - name: customer_region
    sql_table: tpch.main.region
    description: Region, in its role as the customer's region
    joins:
      - name: customer_nation
        sql: '{CUBE}.r_regionkey = {customer_nation}.n_regionkey'
        relationship: one_to_many
    dimensions:
      - name: customer_region_name
        sql: '{CUBE}.r_name'
        type: string
        description: Region of the customer
      - name: r_regionkey
        sql: '{CUBE}.r_regionkey'
        type: number
        primary_key: true
        public: false
