# ---------------- P20 ----------------
- id: Q50
  pattern: P20
  question: How many customers have never placed an order?
  columns: [customer_count]
  order_matters: false
  sql: |
    select count(*) as customer_count from customer c
    where not exists (select 1 from orders o where o.o_custkey = c.c_custkey)

- id: Q51
  pattern: P20
  question: For each market segment, how many customers placed at least one order in 1996 but none in 1997?
  columns: [market_segment, customer_count]
  order_matters: false
  sql: |
    with y as (
      select o_custkey,
             bool_or(year(o_orderdate) = 1996) as in_96,
             bool_or(year(o_orderdate) = 1997) as in_97
      from orders group by 1)
    select c_mktsegment as market_segment, count(*) as customer_count
    from y join customer on o_custkey = c_custkey
    where in_96 and not in_97 group by 1

# ---------------- P21 ----------------
- id: Q52
  pattern: P21
  question: >
    Among customers with at least one order, what share placed their second order 0 to 90 days
    (inclusive) after their first order? Orders are ranked by order date, then order key, so a second
    order on the same day counts as 0 days.
  columns: [repeat_within_90d_share]
  order_matters: false
  sql: |
    with r as (
      select o_custkey, o_orderdate,
             row_number() over (partition by o_custkey order by o_orderdate, o_orderkey) as rn
      from orders),
    p as (
      select o_custkey,
             max(case when rn = 1 then o_orderdate end) as d1,
             max(case when rn = 2 then o_orderdate end) as d2
      from r where rn <= 2 group by 1)
    select avg(case when d2 is not null and d2 - d1 <= 90 then 1.0 else 0.0 end) as repeat_within_90d_share
    from p

# ---------------- P22 ----------------
- id: Q53
  pattern: P22
  question: For each order priority, what are the median and the 90th percentile of order total price?
  columns: [order_priority, median_total_price, p90_total_price]
