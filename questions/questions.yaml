    select o_orderpriority as order_priority,
           percentile_cont(0.5) within group (order by o_totalprice) as median_total_price,
           percentile_cont(0.9) within group (order by o_totalprice) as p90_total_price
    from orders group by 1

- id: Q54
  pattern: P22
  question: For each ship mode, what is the sample standard deviation of line-item quantity?
  columns: [ship_mode, stddev_quantity]
  order_matters: false
  sql: |
    select l_shipmode as ship_mode, stddev_samp(l_quantity) as stddev_quantity from lineitem group by 1

# ---------------- P23 ----------------
- id: Q55
  pattern: P23
  question: >
    For each day of January 1996, how many orders had a total price above 400,000?
    Days with no such orders must appear with 0.
  columns: [order_date, order_count]
  order_matters: true
  sql: |
    with days as (
      select unnest(generate_series(date '1996-01-01', date '1996-01-31', interval 1 day))::date as order_date)
    select d.order_date, count(o.o_orderkey) as order_count
    from days d left join orders o on o.o_orderdate = d.order_date and o.o_totalprice > 400000
    group by 1 order by 1

- id: Q56
  pattern: P23
  question: >
    How many orders were placed in each week (weeks start on Monday) from the week of 1996-01-01
    up to and including the week of 1996-02-19?
  columns: [order_week, order_count]
  order_matters: true
  sql: |
    select date_trunc('week', o_orderdate)::date as order_week, count(*) as order_count
    from orders where o_orderdate >= date '1996-01-01' and o_orderdate < date '1996-02-26'
    group by 1 order by 1

# ---------------- P24 ----------------
- id: Q57
  pattern: P24
  question: For each order priority, show order count, order value and revenue in one result.
  columns: [order_priority, order_count, order_value, revenue]
  order_matters: false
  sql: |
    with o as (select o_orderpriority as order_priority, count(*) as order_count, sum(o_totalprice) as order_value
               from orders group by 1),
    r as (select o_orderpriority as order_priority, sum(l_extendedprice * (1 - l_discount)) as revenue
          from lineitem join orders on l_orderkey = o_orderkey group by 1)
    select order_priority, order_count, order_value, revenue from o join r using (order_priority)

- id: Q58
  pattern: P24
  question: >
    For each part brand, what is the total order value of orders placed in 1997 that contain at least
    one line item of that brand? Each order counts once per brand, however many of its lines are that brand.
  columns: [brand, order_value]
  order_matters: false
  sql: |
    with ob as (
      select distinct p_brand, o_orderkey, o_totalprice
      from lineitem join part on l_partkey = p_partkey join orders on l_orderkey = o_orderkey
      where year(o_orderdate) = 1997)
    select p_brand as brand, sum(o_totalprice) as order_value from ob group by 1

# ---------------- P21 (conversion between two event types) ----------------
- id: Q59
  pattern: P21
  question: >
    Take customers who placed a '5-LOW' priority order in Q1 1996 (Jan 1 to Mar 31). Using each customer's
    first such order as the start, what share of them placed a '1-URGENT' order 0 to 30 days (inclusive)
    after that start?
  columns: [conversion_rate]
  order_matters: false
  sql: |
    with b as (
      select o_custkey, min(o_orderdate) as d from orders
      where o_orderpriority = '5-LOW' and o_orderdate between date '1996-01-01' and date '1996-03-31'
      group by 1)
    select avg(case when exists (
             select 1 from orders o where o.o_custkey = b.o_custkey and o.o_orderpriority = '1-URGENT'
               and o.o_orderdate between b.d and b.d + 30) then 1.0 else 0.0 end) as conversion_rate
    from b
