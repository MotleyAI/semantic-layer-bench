# Generated by scripts/build_ossie.py. Shared OSSIE baseline for every layer.
version: 0.2.0.dev0
semantic_model:
- name: tpch
  description: 'TPC-H sales: line items, orders, customers, suppliers, parts and supply offers'
  datasets:
  - name: lineitem
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.lineitem
    primary_key:
    - l_orderkey
    - l_linenumber
    description: One row per order line; the sales fact
    fields:
    - name: ship_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_shipdate
      datatype: Date
      dimension:
        is_time: true
      description: Date the line item shipped
    - name: commit_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_commitdate
      datatype: Date
      dimension:
        is_time: true
      description: Committed delivery date
    - name: receipt_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_receiptdate
      datatype: Date
      dimension:
        is_time: true
      description: Date the customer received the item
    - name: ship_mode
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_shipmode
      datatype: String
      dimension:
        is_time: false
      description: Shipping mode (AIR, MAIL, SHIP, TRUCK, RAIL, REG AIR, FOB)
    - name: return_flag
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_returnflag
      datatype: String
      dimension:
        is_time: false
      description: R = returned, A = accepted, N = not yet known
    - name: line_status
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_linestatus
      datatype: String
      dimension:
        is_time: false
      description: O = open, F = fulfilled
    - name: ship_instruct
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_shipinstruct
      datatype: String
      dimension:
        is_time: false
    - name: quantity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_quantity
      datatype: Decimal
      dimension:
        is_time: false
    - name: discount
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_discount
      datatype: Decimal
      dimension:
        is_time: false
      description: Discount as a fraction (0.05 = 5%)
    - name: extended_price
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: l_extendedprice
      datatype: Decimal
      dimension:
        is_time: false
      description: Price before discount
  - name: orders
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.orders
    primary_key:
    - o_orderkey
    description: One row per order
    fields:
    - name: order_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: o_orderdate
      datatype: Date
      dimension:
        is_time: true
      description: Date the order was placed
    - name: order_status
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: o_orderstatus
      datatype: String
      dimension:
        is_time: false
      description: F = fulfilled, O = open, P = partial
    - name: order_priority
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: o_orderpriority
      datatype: String
      dimension:
        is_time: false
      description: 1-URGENT .. 5-LOW
    - name: clerk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: o_clerk
      datatype: String
      dimension:
        is_time: false
    - name: total_price
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: o_totalprice
      datatype: Decimal
      dimension:
        is_time: false
      description: Order total as recorded on the order
    - name: order_key
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: o_orderkey
      datatype: Integer
      dimension:
        is_time: false
    - name: customer_key
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: o_custkey
      datatype: Integer
      dimension:
        is_time: false
  - name: customer
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.customer
    primary_key:
    - c_custkey
    description: One row per customer
    fields:
    - name: customer_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_name
      datatype: String
      dimension:
        is_time: false
    - name: market_segment
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_mktsegment
      datatype: String
      dimension:
        is_time: false
    - name: account_balance
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_acctbal
      datatype: Decimal
      dimension:
        is_time: false
    - name: customer_key
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_custkey
      datatype: Integer
      dimension:
        is_time: false
  - name: customer_nation
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.nation
    primary_key:
    - n_nationkey
    description: Nation, in its role as the customer's nation
    fields:
    - name: customer_nation_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: n_name
      datatype: String
      dimension:
        is_time: false
      description: Nation of the customer
  - name: customer_region
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.region
    primary_key:
    - r_regionkey
    description: Region, in its role as the customer's region
    fields:
    - name: customer_region_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: r_name
      datatype: String
      dimension:
        is_time: false
      description: Region of the customer
  - name: supplier
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.supplier
    primary_key:
    - s_suppkey
    description: One row per supplier
    fields:
    - name: supplier_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: s_name
      datatype: String
      dimension:
        is_time: false
    - name: supplier_key
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: s_suppkey
      datatype: Integer
      dimension:
        is_time: false
  - name: supplier_nation
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.nation
    primary_key:
    - n_nationkey
    description: Nation, in its role as the supplier's nation
    fields:
    - name: supplier_nation_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: n_name
      datatype: String
      dimension:
        is_time: false
      description: Nation of the supplier
  - name: supplier_region
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.region
    primary_key:
    - r_regionkey
    description: Region, in its role as the supplier's region
    fields:
    - name: supplier_region_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: r_name
      datatype: String
      dimension:
        is_time: false
      description: Region of the supplier
  - name: part
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.part
    primary_key:
    - p_partkey
    description: One row per part
    fields:
    - name: part_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: p_name
      datatype: String
      dimension:
        is_time: false
    - name: brand
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: p_brand
      datatype: String
      dimension:
        is_time: false
    - name: part_type
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: p_type
      datatype: String
      dimension:
        is_time: false
    - name: container
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: p_container
      datatype: String
      dimension:
        is_time: false
    - name: size
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: p_size
      datatype: Integer
      dimension:
        is_time: false
    - name: manufacturer
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: p_mfgr
      datatype: String
      dimension:
        is_time: false
  - name: partsupp
    source: SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.partsupp
    primary_key:
    - ps_partkey
    - ps_suppkey
    description: One row per (part, supplier) offer; a second fact
    fields:
    - name: available_qty
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ps_availqty
      datatype: Integer
      dimension:
        is_time: false
    - name: supply_cost
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ps_supplycost
      datatype: Decimal
      dimension:
        is_time: false
      description: Cost of one unit from this supplier
  relationships:
  - name: lineitem_to_orders
    from: lineitem
    to: orders
    from_columns:
    - l_orderkey
    to_columns:
    - o_orderkey
  - name: lineitem_to_part
    from: lineitem
    to: part
    from_columns:
    - l_partkey
    to_columns:
    - p_partkey
  - name: lineitem_to_supplier
    from: lineitem
    to: supplier
    from_columns:
    - l_suppkey
    to_columns:
    - s_suppkey
  - name: lineitem_to_partsupp
    from: lineitem
    to: partsupp
    from_columns:
    - l_partkey
    - l_suppkey
    to_columns:
    - ps_partkey
    - ps_suppkey
  - name: orders_to_customer
    from: orders
    to: customer
    from_columns:
    - o_custkey
    to_columns:
    - c_custkey
  - name: customer_to_customer_nation
    from: customer
    to: customer_nation
    from_columns:
    - c_nationkey
    to_columns:
    - n_nationkey
  - name: customer_nation_to_customer_region
    from: customer_nation
    to: customer_region
    from_columns:
    - n_regionkey
    to_columns:
    - r_regionkey
  - name: supplier_to_supplier_nation
    from: supplier
    to: supplier_nation
    from_columns:
    - s_nationkey
    to_columns:
    - n_nationkey
  - name: supplier_nation_to_supplier_region
    from: supplier_nation
    to: supplier_region
    from_columns:
    - n_regionkey
    to_columns:
    - r_regionkey
  - name: partsupp_to_part
    from: partsupp
    to: part
    from_columns:
    - ps_partkey
    to_columns:
    - p_partkey
  - name: partsupp_to_supplier
    from: partsupp
    to: supplier
    from_columns:
    - ps_suppkey
    to_columns:
    - s_suppkey
  metrics:
  - name: revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount))
    description: Net revenue after discount
  - name: gross_sales
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(lineitem.l_extendedprice)
    description: Revenue before discount
  - name: total_quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(lineitem.l_quantity)
    description: Units sold
  - name: line_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(lineitem.l_orderkey)
    description: Number of order lines
  - name: avg_discount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(lineitem.l_discount)
    description: Average line discount
  - name: order_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(orders.o_orderkey)
    description: Number of orders
  - name: order_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(orders.o_totalprice)
    description: Sum of order total price
  - name: avg_order_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(orders.o_totalprice) / COUNT(orders.o_orderkey)
    description: Order value per order
  - name: customer_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT customer.c_custkey)
    description: Distinct customers
  - name: total_available_qty
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(partsupp.ps_availqty)
    description: Supply quantity available
  - name: supplier_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT supplier.s_suppkey)
    description: Distinct suppliers
