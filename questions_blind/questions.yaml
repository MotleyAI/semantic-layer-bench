# Blind question set (round 2). Vocabulary: ../model_contract.md
# Questions B01..B50 were written by an isolated author who saw only the business domain and the
# model vocabulary (see authored.yaml, kept verbatim). Ground-truth SQL was added afterwards.
# Conventions: shares are fractions (0.25 = 25%); date ranges are inclusive; year buckets are
# integers, month/quarter buckets are the first day of the bucket; revenue =
# SUM(l_extendedprice * (1 - l_discount)); 1998 is partial (orders end 1998-08-02).

questions:
  # ---------------------------------------------------------------- OPERATIONS
  - id: B01
    domain: operations
    difficulty: simple
    persona: Head of Logistics
    decision: which carrier contracts to renegotiate
    question: >-
      Across all our history, what share of order lines arrived later than we
      promised, broken down by shipping mode?
    interpretation: |
      All line items (ship dates 1992 through 1998, no date filter).
      A line is late when receipt_date > commit_date (strictly later).
      late_share = late line count / total line count for that ship_mode, as a fraction (0.25 = 25%).
      One row per ship_mode (7 rows).
    columns: [ship_mode, line_count, late_share]
    order_matters: false
    sql: |
      select l_shipmode as ship_mode, count(*) as line_count,
             avg(case when l_receiptdate > l_commitdate then 1.0 else 0.0 end) as late_share
      from lineitem group by 1

  - id: B02
    domain: operations
    difficulty: simple
    persona: Quality Manager
    decision: where to focus supplier quality audits
    question: >-
      What share of our order lines get returned, by the region our suppliers
      are located in?
    interpretation: |
      All line items, no date filter.
      A line is returned when return_flag = 'R'.
      returned_share = returned line count / total line count in that supplier region, as a fraction.
      Grouped by supplier_region_name (5 rows).
    columns: [supplier_region_name, returned_share]
    order_matters: false
    sql: |
      select r_name as supplier_region_name,
             avg(case when l_returnflag = 'R' then 1.0 else 0.0 end) as returned_share
      from lineitem join supplier on l_suppkey = s_suppkey
      join nation on s_nationkey = n_nationkey join region on n_regionkey = r_regionkey
      group by 1

  - id: B03
    domain: operations
    difficulty: simple
    persona: Warehouse Operations Manager
    decision: how to allocate dock capacity by carrier type for next year
    question: >-
      How many units did we ship in 1997 with each shipping mode?
    interpretation: |
      Line items with ship_date between 1997-01-01 and 1997-12-31 inclusive.
      total_quantity = sum of quantity. One row per ship_mode (7 rows).
    columns: [ship_mode, total_quantity]
    order_matters: false
    sql: |
      select l_shipmode as ship_mode, sum(l_quantity) as total_quantity
      from lineitem where l_shipdate between date '1997-01-01' and date '1997-12-31'
      group by 1

  - id: B04
    domain: operations
    difficulty: simple
    persona: Supply Planner
    decision: whether regional supply depth supports expansion plans
    question: >-
      How much stock do our suppliers report as available, by supplier region?
    interpretation: |
      Use every supplier offer (one row per part and supplier), regardless of sales.
      total_available_qty = sum of available_qty over offers of suppliers in that region.
      Grouped by supplier_region_name (5 rows).
    columns: [supplier_region_name, total_available_qty]
    order_matters: false
    sql: |
      select r_name as supplier_region_name, sum(ps_availqty) as total_available_qty
      from partsupp join supplier on ps_suppkey = s_suppkey
      join nation on s_nationkey = n_nationkey join region on n_regionkey = r_regionkey
      group by 1

  - id: B05
    domain: operations
    difficulty: simple
    persona: Order Desk Supervisor
    decision: how much backlog the fulfilment team must clear
    question: >-
      How many orders do we have in each order status?
    interpretation: |
      All orders, no date filter. Count of orders per order_status (F, O, P).
    columns: [order_status, order_count]
    order_matters: false
    sql: |
      select o_orderstatus as order_status, count(*) as order_count from orders group by 1

  - id: B06
    domain: operations
    difficulty: medium
    persona: Head of Logistics
    decision: which shipping modes to quote to customers for time-sensitive deliveries
    question: >-
      For lines shipped in 1997, how many days does transit take on average
      with each shipping mode?
    interpretation: |
      Line items with ship_date between 1997-01-01 and 1997-12-31 inclusive.
      transit days = receipt_date minus ship_date, in whole days.
      avg_transit_days = arithmetic mean of transit days over the lines, per ship_mode (7 rows).
    columns: [ship_mode, avg_transit_days]
    order_matters: false
    sql: |
      select l_shipmode as ship_mode, avg(l_receiptdate - l_shipdate) as avg_transit_days
      from lineitem where l_shipdate between date '1997-01-01' and date '1997-12-31'
      group by 1

  - id: B07
    domain: operations
    difficulty: medium
    persona: Procurement Director
    decision: which suppliers to put on a performance improvement plan
    question: >-
      Which 10 suppliers had the worst late-delivery rate on lines received in
      1996 and 1997, among suppliers with meaningful volume?
    interpretation: |
      Line items with receipt_date between 1996-01-01 and 1997-12-31 inclusive.
      Late = receipt_date > commit_date. late_share = late lines / all lines for the supplier, as a fraction.
      Only suppliers with at least 100 such lines (line_count >= 100).
      Rank by late_share descending; ties broken by supplier_name ascending. Return the top 10.
    columns: [supplier_name, line_count, late_share]
    order_matters: true
    sql: |
      select s_name as supplier_name, count(*) as line_count,
             avg(case when l_receiptdate > l_commitdate then 1.0 else 0.0 end) as late_share
      from lineitem join supplier on l_suppkey = s_suppkey
      where l_receiptdate between date '1996-01-01' and date '1997-12-31'
      group by 1 having count(*) >= 100
      order by late_share desc, supplier_name asc limit 10

  - id: B08
    domain: operations
    difficulty: medium
    persona: Customer Service Director
    decision: whether urgent orders actually receive faster, more reliable fulfilment
    question: >-
      For orders placed in 1995, does the on-time performance of order lines
      differ by order priority?
    interpretation: |
      Line items whose order has order_date between 1995-01-01 and 1995-12-31 inclusive.
      Late = receipt_date > commit_date. late_share = late lines / all lines, as a fraction.
      One row per order_priority (5 rows).
    columns: [order_priority, line_count, late_share]
    order_matters: false
    sql: |
      select o_orderpriority as order_priority, count(*) as line_count,
             avg(case when l_receiptdate > l_commitdate then 1.0 else 0.0 end) as late_share
      from lineitem join orders on l_orderkey = o_orderkey
      where o_orderdate between date '1995-01-01' and date '1995-12-31'
      group by 1

  - id: B09
    domain: operations
    difficulty: medium
    persona: Head of Logistics
    decision: whether to add seasonal carrier capacity in peak months
    question: >-
      How did our late-delivery rate move month by month in 1997?
    interpretation: |
      Line items with ship_date between 1997-01-01 and 1997-12-31 inclusive, bucketed by ship month.
      ship_month = first day of the ship month (date).
      Late = receipt_date > commit_date. late_share = late lines / all lines in the month, as a fraction.
      12 rows.
    columns: [ship_month, late_share]
    order_matters: false
    sql: |
      select date_trunc('month', l_shipdate)::date as ship_month,
             avg(case when l_receiptdate > l_commitdate then 1.0 else 0.0 end) as late_share
      from lineitem where l_shipdate between date '1997-01-01' and date '1997-12-31'
      group by 1

  - id: B10
    domain: operations
    difficulty: medium
    persona: Quality Manager
    decision: which manufacturers to raise quality claims with
    question: >-
      Of the units customers received in 1994, what share by volume came back
      as returns, for each manufacturer?
    interpretation: |
      Line items with receipt_date between 1994-01-01 and 1994-12-31 inclusive.
      returned_qty_share = sum of quantity on lines with return_flag = 'R' / sum of quantity on all lines,
      per part manufacturer, as a fraction. 5 rows.
    columns: [manufacturer, returned_qty_share]
    order_matters: false
    sql: |
      select p_mfgr as manufacturer,
             sum(case when l_returnflag = 'R' then l_quantity else 0 end) / sum(l_quantity) as returned_qty_share
      from lineitem join part on l_partkey = p_partkey
      where l_receiptdate between date '1994-01-01' and date '1994-12-31'
      group by 1

  - id: B11
    domain: operations
    difficulty: medium
    persona: Procurement Director
    decision: which sourcing countries cause the longest delays
    question: >-
      When lines shipped in 1996 arrived late, how late were they on average,
      by supplier country?
    interpretation: |
      Line items with ship_date between 1996-01-01 and 1996-12-31 inclusive, restricted to late lines
      (receipt_date > commit_date).
      days late = receipt_date minus commit_date in whole days.
      late_line_count = number of late lines; avg_days_late = mean days late over those lines.
      One row per supplier_nation_name (25 rows).
    columns: [supplier_nation_name, late_line_count, avg_days_late]
    order_matters: false
    sql: |
      select n_name as supplier_nation_name, count(*) as late_line_count,
             avg(l_receiptdate - l_commitdate) as avg_days_late
      from lineitem join supplier on l_suppkey = s_suppkey join nation on s_nationkey = n_nationkey
      where l_shipdate between date '1996-01-01' and date '1996-12-31' and l_receiptdate > l_commitdate
      group by 1

  - id: B12
    domain: operations
    difficulty: medium
    persona: Inventory Manager
    decision: which brass part types are under- or over-stocked relative to demand
    question: >-
      For our brass part types, how does the stock suppliers have available
      compare with the units we sold in 1997?
    interpretation: |
      Part types whose part_type contains the word 'BRASS'.
      total_available_qty = sum of available_qty over all supplier offers for parts of that type (no date filter).
      total_quantity_1997 = sum of line quantity for parts of that type on orders with order_date in 1997
      (1997-01-01 to 1997-12-31 inclusive).
      cover_ratio = total_available_qty / total_quantity_1997.
      One row per part_type.
    columns: [part_type, total_available_qty, total_quantity_1997, cover_ratio]
    order_matters: false
    sql: |
      with stock as (
        select p_type, sum(ps_availqty) as total_available_qty
        from partsupp join part on ps_partkey = p_partkey
        where p_type like '%BRASS%' group by 1),
      sold as (
        select p_type, sum(l_quantity) as total_quantity_1997
        from lineitem join orders on l_orderkey = o_orderkey join part on l_partkey = p_partkey
        where p_type like '%BRASS%' and o_orderdate between date '1997-01-01' and date '1997-12-31'
        group by 1)
      select stock.p_type as part_type, total_available_qty, total_quantity_1997,
             total_available_qty / total_quantity_1997 as cover_ratio
      from stock join sold using (p_type)

  - id: B13
    domain: operations
    difficulty: hard
    persona: Head of Logistics
    decision: whether late deliveries are a warehouse dispatch problem or a carrier transit problem
    question: >-
      For late deliveries on lines shipped in 1997, how much of the lateness
      comes from us shipping after the promised date versus shipping on time
      but the carrier delivering late, by shipping mode?
    interpretation: |
      Line items with ship_date between 1997-01-01 and 1997-12-31 inclusive and late (receipt_date > commit_date).
      late_line_count = number of such late lines per ship_mode.
      shipped_late_share = fraction of those late lines where ship_date > commit_date.
      transit_late_share = fraction of those late lines where ship_date <= commit_date.
      The two shares sum to 1 per ship_mode. 7 rows.
    columns: [ship_mode, late_line_count, shipped_late_share, transit_late_share]
    order_matters: false
    sql: |
      select l_shipmode as ship_mode, count(*) as late_line_count,
             avg(case when l_shipdate > l_commitdate then 1.0 else 0.0 end) as shipped_late_share,
             avg(case when l_shipdate <= l_commitdate then 1.0 else 0.0 end) as transit_late_share
      from lineitem
      where l_shipdate between date '1997-01-01' and date '1997-12-31' and l_receiptdate > l_commitdate
      group by 1

  - id: B14
    domain: operations
    difficulty: hard
    persona: Procurement Director
    decision: which suppliers' reliability is deteriorating and needs an escalation call
    question: >-
      Which 10 suppliers saw their late-delivery rate worsen the most from 1995
      to 1996?
    interpretation: |
      Year assigned by ship_date (1995 = 1995-01-01..1995-12-31, 1996 = 1996-01-01..1996-12-31).
      Late = receipt_date > commit_date; late_share = late lines / all lines for the supplier in that year.
      Only suppliers with at least 50 lines in each of the two years.
      late_share_change = late_share_1996 - late_share_1995 (fraction points).
      Rank by late_share_change descending; ties by supplier_name ascending. Return top 10.
    columns: [supplier_name, late_share_1995, late_share_1996, late_share_change]
    order_matters: true
    sql: |
      with y as (
        select s_name, year(l_shipdate) as yr, count(*) as n,
               avg(case when l_receiptdate > l_commitdate then 1.0 else 0.0 end) as late_share
        from lineitem join supplier on l_suppkey = s_suppkey
        where l_shipdate between date '1995-01-01' and date '1996-12-31'
        group by 1, 2)
      select a.s_name as supplier_name, a.late_share as late_share_1995, b.late_share as late_share_1996,
             b.late_share - a.late_share as late_share_change
      from y a join y b on a.s_name = b.s_name and a.yr = 1995 and b.yr = 1996
      where a.n >= 50 and b.n >= 50
      order by late_share_change desc, supplier_name asc limit 10

  - id: B15
    domain: operations
    difficulty: hard
    persona: Customer Experience Lead
    decision: whether lateness is concentrated in a few orders or spread across many
    question: >-
      For finished orders placed in 1994, how many orders had zero, one, two,
      and so on late lines?
    interpretation: |
      Orders with order_status = 'F' and order_date between 1994-01-01 and 1994-12-31 inclusive.
      (Fix log: originally 1996, which returned no rows because no 1996 order has status F.)
      For each order, count its lines with receipt_date > commit_date (late_lines_in_order, integer >= 0).
      Return the number of orders for each distinct value of late_lines_in_order, including 0.
    columns: [late_lines_in_order, order_count]
    order_matters: false
    sql: |
      with per_order as (
        select o_orderkey, sum(case when l_receiptdate > l_commitdate then 1 else 0 end) as late_lines
        from orders join lineitem on l_orderkey = o_orderkey
        where o_orderstatus = 'F' and o_orderdate between date '1994-01-01' and date '1994-12-31'
        group by 1)
      select late_lines as late_lines_in_order, count(*) as order_count from per_order group by 1

  - id: B16
    domain: operations
    difficulty: hard
    persona: VP Supply Chain
    decision: which sourcing country in each region to target first for a reliability program
    question: >-
      In each supplier region, which supplier country had the worst
      late-delivery rate on lines shipped in 1997?
    interpretation: |
      Line items with ship_date between 1997-01-01 and 1997-12-31 inclusive.
      Late = receipt_date > commit_date; late_share = late lines / all lines per supplier nation.
      Within each supplier_region_name, keep the one nation with the highest late_share;
      ties broken by supplier_nation_name ascending. 5 rows.
    columns: [supplier_region_name, supplier_nation_name, late_share]
    order_matters: false
    sql: |
      with n as (
        select r_name, n_name,
               avg(case when l_receiptdate > l_commitdate then 1.0 else 0.0 end) as late_share
        from lineitem join supplier on l_suppkey = s_suppkey
        join nation on s_nationkey = n_nationkey join region on n_regionkey = r_regionkey
        where l_shipdate between date '1997-01-01' and date '1997-12-31'
        group by 1, 2)
      select r_name as supplier_region_name, n_name as supplier_nation_name, late_share
      from n qualify row_number() over (partition by r_name order by late_share desc, n_name asc) = 1

  - id: B17
    domain: operations
    difficulty: hard
    persona: Procurement Director
    decision: whether buyers are routing volume to the cheapest available supplier
    question: >-
      For units shipped in 1997, what share was sourced from the cheapest
      supplier offer available for that part, by manufacturer?
    interpretation: |
      Line items with ship_date between 1997-01-01 and 1997-12-31 inclusive.
      For each part, the cheapest supply_cost is the minimum supply_cost across all supplier offers for that part.
      A line is cheapest-sourced if the supply_cost of its own supplier offer (its part + supplier) equals that minimum
      (ties: every supplier at the minimum counts as cheapest).
      cheapest_source_qty_share = quantity on cheapest-sourced lines / total quantity, per part manufacturer, as a fraction.
      5 rows.
    columns: [manufacturer, cheapest_source_qty_share]
    order_matters: false
    sql: |
      with mincost as (select ps_partkey, min(ps_supplycost) as min_cost from partsupp group by 1)
      select p_mfgr as manufacturer,
             sum(case when ps.ps_supplycost = m.min_cost then l_quantity else 0 end) / sum(l_quantity)
               as cheapest_source_qty_share
      from lineitem
      join partsupp ps on l_partkey = ps.ps_partkey and l_suppkey = ps.ps_suppkey
      join mincost m on l_partkey = m.ps_partkey
      join part on l_partkey = p_partkey
      where l_shipdate between date '1997-01-01' and date '1997-12-31'
      group by 1

  # ---------------------------------------------------------------- FINANCE
  - id: B18
    domain: finance
    difficulty: simple
    persona: CFO
    decision: setting the multi-year revenue baseline for planning
    question: >-
      What was our revenue each year?
    interpretation: |
      Year by order_date of the line's order. Revenue = sum of extended_price * (1 - discount).
      All years 1992 through 1998; 1998 is included as-is even though it only covers orders up to 1998-08-02.
      order_year is an integer. 7 rows.
    columns: [order_year, revenue]
    order_matters: false
    sql: |
      select year(o_orderdate) as order_year, sum(l_extendedprice * (1 - l_discount)) as revenue
      from lineitem join orders on l_orderkey = o_orderkey group by 1

  - id: B19
    domain: finance
    difficulty: simple
    persona: Pricing Manager
    decision: whether discount policy differs too much across customer segments
    question: >-
      What average discount do we give on order lines to each customer segment?
    interpretation: |
      All line items, no date filter. avg_discount = simple average of the line discount (fraction, e.g. 0.05),
      grouped by the ordering customer's market_segment. 5 rows.
    columns: [market_segment, avg_discount]
    order_matters: false
    sql: |
      select c_mktsegment as market_segment, avg(l_discount) as avg_discount
      from lineitem join orders on l_orderkey = o_orderkey join customer on o_custkey = c_custkey
      group by 1

  - id: B20
    domain: finance
    difficulty: simple
    persona: Financial Controller
    decision: sizing the cost of discounting in the annual report
    question: >-
      In 1996, what were our gross sales, our net revenue after discounts, and
      how much did discounts cost us in total?
    interpretation: |
      Line items whose order has order_date between 1996-01-01 and 1996-12-31 inclusive.
      gross_sales = sum of extended_price; revenue = sum of extended_price * (1 - discount);
      discount_amount = gross_sales - revenue. One row.
    columns: [gross_sales, revenue, discount_amount]
    order_matters: false
    sql: |
      select sum(l_extendedprice) as gross_sales, sum(l_extendedprice * (1 - l_discount)) as revenue,
             sum(l_extendedprice) - sum(l_extendedprice * (1 - l_discount)) as discount_amount
      from lineitem join orders on l_orderkey = o_orderkey
      where o_orderdate between date '1996-01-01' and date '1996-12-31'

  - id: B21
    domain: finance
    difficulty: simple
    persona: Sales Finance Analyst
    decision: whether urgent orders justify a premium handling fee
    question: >-
      What was the average order value by order priority for orders placed in
      1997?
    interpretation: |
      Orders with order_date between 1997-01-01 and 1997-12-31 inclusive.
      avg_order_value = sum of order total_price / number of orders, per order_priority. 5 rows.
    columns: [order_priority, avg_order_value]
    order_matters: false
    sql: |
      select o_orderpriority as order_priority, sum(o_totalprice) / count(*) as avg_order_value
      from orders where o_orderdate between date '1997-01-01' and date '1997-12-31' group by 1

  - id: B22
    domain: finance
    difficulty: simple
    persona: CFO
    decision: regional budget allocation for next year
    question: >-
      How much revenue did each customer region generate in 1997?
    interpretation: |
      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      Revenue = sum of extended_price * (1 - discount), grouped by the customer's region (customer_region_name). 5 rows.
    columns: [customer_region_name, revenue]
    order_matters: false
    sql: |
      select r_name as customer_region_name, sum(l_extendedprice * (1 - l_discount)) as revenue
      from lineitem join orders on l_orderkey = o_orderkey join customer on o_custkey = c_custkey
      join nation on c_nationkey = n_nationkey join region on n_regionkey = r_regionkey
      where o_orderdate between date '1997-01-01' and date '1997-12-31'
      group by 1

  - id: B23
    domain: finance
    difficulty: medium
    persona: CFO
    decision: whether growth is accelerating or slowing for the board update
    question: >-
      How fast did revenue grow year over year from 1993 to 1997?
    interpretation: |
      Revenue = sum of extended_price * (1 - discount), year by order_date.
      For each order_year 1993..1997: revenue_growth = revenue / revenue of previous year - 1, as a fraction.
      1992 is used only as the base for 1993; 1998 is excluded because it is partial. 5 rows.
    columns: [order_year, revenue, revenue_growth]
    order_matters: false
    sql: |
      with y as (
        select year(o_orderdate) as yr, sum(l_extendedprice * (1 - l_discount)) as revenue
        from lineitem join orders on l_orderkey = o_orderkey group by 1)
      select a.yr as order_year, a.revenue, a.revenue / b.revenue - 1 as revenue_growth
      from y a join y b on b.yr = a.yr - 1 where a.yr between 1993 and 1997

  - id: B24
    domain: finance
    difficulty: medium
    persona: Head of Procurement Finance
    decision: which sourcing regions deliver the best margins
    question: >-
      What revenue, margin, and margin rate did we earn in 1997 on goods sourced
      from each supplier region?
    interpretation: |
      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      revenue = sum of extended_price * (1 - discount).
      margin = revenue - sum of (supply_cost of the line's supplier offer for that part and supplier * quantity).
      margin_rate = margin / revenue, as a fraction. Grouped by supplier_region_name. 5 rows.
    columns: [supplier_region_name, revenue, margin, margin_rate]
    order_matters: false
    sql: |
      select r_name as supplier_region_name,
             sum(l_extendedprice * (1 - l_discount)) as revenue,
             sum(l_extendedprice * (1 - l_discount)) - sum(ps_supplycost * l_quantity) as margin,
             (sum(l_extendedprice * (1 - l_discount)) - sum(ps_supplycost * l_quantity))
               / sum(l_extendedprice * (1 - l_discount)) as margin_rate
      from lineitem join orders on l_orderkey = o_orderkey
      join partsupp on l_partkey = ps_partkey and l_suppkey = ps_suppkey
      join supplier on l_suppkey = s_suppkey
      join nation on s_nationkey = n_nationkey join region on n_regionkey = r_regionkey
      where o_orderdate between date '1997-01-01' and date '1997-12-31'
      group by 1

  - id: B25
    domain: finance
    difficulty: medium
    persona: Category Finance Manager
    decision: which brands to prioritise in the 1997 product range review
    question: >-
      Which 10 brands made us the most margin on orders placed in 1996?
    interpretation: |
      Line items whose order has order_date between 1996-01-01 and 1996-12-31 inclusive.
      margin = sum of extended_price * (1 - discount) - sum of supply_cost * quantity (supply_cost from the line's
      part + supplier offer). Rank brands by margin descending; ties by brand ascending. Top 10.
    columns: [brand, margin]
    order_matters: true
    sql: |
      select p_brand as brand,
             sum(l_extendedprice * (1 - l_discount)) - sum(ps_supplycost * l_quantity) as margin
      from lineitem join orders on l_orderkey = o_orderkey
      join partsupp on l_partkey = ps_partkey and l_suppkey = ps_suppkey
      join part on l_partkey = p_partkey
      where o_orderdate between date '1996-01-01' and date '1996-12-31'
      group by 1 order by margin desc, brand asc limit 10

  - id: B26
    domain: finance
    difficulty: medium
    persona: FP&A Manager
    decision: building the monthly seasonality profile for the forecast
    question: >-
      What was our revenue in each month of 1997?
    interpretation: |
      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      order_month = first day of the order month (date). Revenue = sum of extended_price * (1 - discount). 12 rows.
    columns: [order_month, revenue]
    order_matters: false
    sql: |
      select date_trunc('month', o_orderdate)::date as order_month,
             sum(l_extendedprice * (1 - l_discount)) as revenue
      from lineitem join orders on l_orderkey = o_orderkey
      where o_orderdate between date '1997-01-01' and date '1997-12-31'
      group by 1

  - id: B27
    domain: finance
    difficulty: medium
    persona: Pricing Manager
    decision: whether deep discounts drive enough volume to keep them
    question: >-
      For orders placed in 1997, how many lines and how much revenue did we
      book at each discount level?
    interpretation: |
      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      Group by the exact discount value of the line (e.g. 0.00, 0.01, ... 0.10).
      line_count = number of lines; revenue = sum of extended_price * (1 - discount).
    columns: [discount, line_count, revenue]
    order_matters: false
