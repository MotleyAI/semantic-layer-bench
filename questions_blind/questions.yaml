  - id: B45
    domain: marketing
    difficulty: medium
    persona: Regional Marketing Lead
    decision: where customer wallet share is highest for upsell campaigns
    question: >-
      How much revenue per active customer did each region generate in 1997?
    interpretation: |
      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      revenue = sum of extended_price * (1 - discount); customer_count = distinct customers with a 1997 order;
      revenue_per_customer = revenue / customer_count. Grouped by customer_region_name. 5 rows.
