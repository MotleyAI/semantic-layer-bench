  - id: B46
    domain: marketing
    difficulty: hard
    persona: CRM Manager
    decision: whether newer customer cohorts retain as well as older ones
    question: >-
      Grouping customers by the year of their first order, how many joined each
      year from 1992 to 1996, and what share of them ordered again in the
      following calendar year?
    interpretation: |
      first_order_year = calendar year of the customer's earliest order_date across all orders.
      Cohorts 1992..1996 only. customer_count = customers in the cohort.
      retained_next_year_share = share of the cohort's customers with at least one order whose order_date falls in
      first_order_year + 1, as a fraction. 5 rows.
    columns: [first_order_year, customer_count, retained_next_year_share]
    order_matters: false
    sql: |
      with f as (select o_custkey, year(min(o_orderdate)) as fy from orders group by 1),
      nxt as (select distinct o_custkey, year(o_orderdate) as yr from orders)
      select f.fy as first_order_year, count(*) as customer_count,
             avg(case when nxt.o_custkey is not null then 1.0 else 0.0 end) as retained_next_year_share
      from f left join nxt on nxt.o_custkey = f.o_custkey and nxt.yr = f.fy + 1
      where f.fy between 1992 and 1996
      group by 1

  - id: B47
    domain: marketing
    difficulty: hard
    persona: CRM Manager
    decision: sizing a win-back campaign by segment
    question: >-
      How many customers bought in 1996 but not at all in 1997, and how much
      revenue did they give us in 1996, by segment?
    interpretation: |
      Lapsed customer = has at least one order with order_date in 1996 and no order with order_date in 1997.
      lapsed_customer_count = number of such customers per market_segment.
      lapsed_revenue_1996 = their revenue (sum of extended_price * (1 - discount)) on orders dated in 1996. 5 rows.
    columns: [market_segment, lapsed_customer_count, lapsed_revenue_1996]
    order_matters: false
    sql: |
      with c96 as (select distinct o_custkey from orders where year(o_orderdate) = 1996),
      c97 as (select distinct o_custkey from orders where year(o_orderdate) = 1997),
      lapsed as (select o_custkey from c96 where o_custkey not in (select o_custkey from c97)),
      rev as (
        select o_custkey, sum(l_extendedprice * (1 - l_discount)) as revenue
        from lineitem join orders on l_orderkey = o_orderkey
        where year(o_orderdate) = 1996 group by 1)
      select c_mktsegment as market_segment, count(*) as lapsed_customer_count,
             sum(coalesce(rev.revenue, 0)) as lapsed_revenue_1996
      from lapsed join customer on lapsed.o_custkey = c_custkey
      left join rev on rev.o_custkey = lapsed.o_custkey
      group by 1

