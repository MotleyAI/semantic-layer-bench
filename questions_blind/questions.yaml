  - id: B28
    domain: finance
    difficulty: medium
    persona: Financial Controller
    decision: how big a returns provision to carry
    question: >-
      Each year from 1992 to 1997, how much revenue was on lines that were
      later returned, and what share of that year's revenue was it?
    interpretation: |
      Year by order_date of the line's order, 1992..1997 (1998 excluded as partial).
      returned_revenue = revenue (extended_price * (1 - discount)) on lines with return_flag = 'R'.
      returned_revenue_share = returned_revenue / total revenue of that year, as a fraction. 6 rows.
    columns: [order_year, returned_revenue, returned_revenue_share]
    order_matters: false
    sql: |
      select year(o_orderdate) as order_year,
             sum(case when l_returnflag = 'R' then l_extendedprice * (1 - l_discount) else 0 end) as returned_revenue,
             sum(case when l_returnflag = 'R' then l_extendedprice * (1 - l_discount) else 0 end)
               / sum(l_extendedprice * (1 - l_discount)) as returned_revenue_share
      from lineitem join orders on l_orderkey = o_orderkey
      where o_orderdate between date '1992-01-01' and date '1997-12-31'
      group by 1

  - id: B29
    domain: finance
    difficulty: medium
    persona: CFO
    decision: whether the 1998 trajectory is ahead of or behind 1997 by region
    question: >-
      Comparing the first half of 1998 with the first half of 1997, how did
      revenue change in each customer region?
    interpretation: |
      First half = orders with order_date from January 1 to June 30 inclusive of the given year
      (1997-01-01..1997-06-30 and 1998-01-01..1998-06-30), so the partial 1998 year is compared like for like.
      Revenue = sum of extended_price * (1 - discount), by customer_region_name.
      revenue_growth = revenue_h1_1998 / revenue_h1_1997 - 1, as a fraction. 5 rows.
    columns: [customer_region_name, revenue_h1_1997, revenue_h1_1998, revenue_growth]
    order_matters: false
    sql: |
      with r as (
        select r_name,
               sum(case when o_orderdate between date '1997-01-01' and date '1997-06-30'
                        then l_extendedprice * (1 - l_discount) else 0 end) as h97,
               sum(case when o_orderdate between date '1998-01-01' and date '1998-06-30'
                        then l_extendedprice * (1 - l_discount) else 0 end) as h98
        from lineitem join orders on l_orderkey = o_orderkey join customer on o_custkey = c_custkey
        join nation on c_nationkey = n_nationkey join region on n_regionkey = r_regionkey
        where o_orderdate between date '1997-01-01' and date '1998-06-30'
        group by 1)
      select r_name as customer_region_name, h97 as revenue_h1_1997, h98 as revenue_h1_1998,
             h98 / h97 - 1 as revenue_growth
      from r

  - id: B30
    domain: finance
    difficulty: hard
    persona: CFO
    decision: assessing revenue concentration risk on our largest accounts
    question: >-
      How much of our 1997 revenue came from our 100 biggest customers that
      year?
    interpretation: |
      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      Revenue = sum of extended_price * (1 - discount) per customer. Top 100 customers by 1997 revenue
      (ties broken by customer_key ascending).
      top100_revenue = their combined revenue; total_revenue = all 1997 revenue;
      top100_share = top100_revenue / total_revenue, as a fraction. One row.
    columns: [top100_revenue, total_revenue, top100_share]
    order_matters: false
    sql: |
      with c as (
        select o_custkey, sum(l_extendedprice * (1 - l_discount)) as revenue
        from lineitem join orders on l_orderkey = o_orderkey
        where o_orderdate between date '1997-01-01' and date '1997-12-31'
        group by 1),
      top as (select revenue from c order by revenue desc, o_custkey asc limit 100)
      select (select sum(revenue) from top) as top100_revenue,
             (select sum(revenue) from c) as total_revenue,
             (select sum(revenue) from top) / (select sum(revenue) from c) as top100_share

  - id: B31
    domain: finance
    difficulty: hard
    persona: Head of Sales Finance
    decision: which countries anchor each segment's revenue for account coverage planning
    question: >-
      In each customer segment, which three customer countries produced the
      most revenue in 1997, and what share of the segment's revenue did each
      represent?
    interpretation: |
      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      Revenue = sum of extended_price * (1 - discount) by market_segment and customer_nation_name.
      segment_revenue_share = nation revenue / total revenue of that market_segment (all nations), as a fraction.
      Within each market_segment rank nations by revenue descending (ties by customer_nation_name ascending);
      rank_in_segment = 1, 2, 3. Keep ranks 1-3 (15 rows). Order by market_segment ascending, then rank_in_segment.
    columns: [market_segment, customer_nation_name, revenue, segment_revenue_share, rank_in_segment]
    order_matters: true
    sql: |
      with n as (
        select c_mktsegment, n_name, sum(l_extendedprice * (1 - l_discount)) as revenue
        from lineitem join orders on l_orderkey = o_orderkey join customer on o_custkey = c_custkey
        join nation on c_nationkey = n_nationkey
        where o_orderdate between date '1997-01-01' and date '1997-12-31'
        group by 1, 2),
      r as (
        select *, revenue / sum(revenue) over (partition by c_mktsegment) as segment_revenue_share,
               row_number() over (partition by c_mktsegment order by revenue desc, n_name asc) as rank_in_segment
        from n)
      select c_mktsegment as market_segment, n_name as customer_nation_name, revenue,
             segment_revenue_share, rank_in_segment
      from r where rank_in_segment <= 3 order by market_segment, rank_in_segment

  - id: B32
    domain: finance
    difficulty: hard
    persona: Pricing Manager
    decision: which brands are being sold below cost and need price floors
    question: >-
      For orders placed in 1997, how often did we sell lines below their
      supply cost, and how much margin did those lines lose, by brand?
    interpretation: |
      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      Line margin = extended_price * (1 - discount) - supply_cost * quantity (supply_cost from the line's
      part + supplier offer). A line is below cost when its line margin < 0.
      below_cost_line_share = below-cost lines / all lines for the brand, as a fraction.
      below_cost_margin = sum of line margin over below-cost lines (a negative number; 0 if none).
      One row per brand (25 rows).
    columns: [brand, below_cost_line_share, below_cost_margin]
    order_matters: false
    sql: |
      with l as (
        select p_brand, l_extendedprice * (1 - l_discount) - ps_supplycost * l_quantity as m
        from lineitem join orders on l_orderkey = o_orderkey
        join partsupp on l_partkey = ps_partkey and l_suppkey = ps_suppkey
        join part on l_partkey = p_partkey
        where o_orderdate between date '1997-01-01' and date '1997-12-31')
      select p_brand as brand,
             avg(case when m < 0 then 1.0 else 0.0 end) as below_cost_line_share,
             coalesce(sum(case when m < 0 then m end), 0) as below_cost_margin
      from l group by 1

  - id: B33
    domain: finance
    difficulty: hard
    persona: Sales Operations Director
    decision: which order clerks to recognise for growing deal size
    question: >-
      Which 10 clerks grew their average order value the most from 1996 to
      1997?
    interpretation: |
      Orders assigned to year by order_date (calendar years 1996 and 1997).
      avg_order_value = sum of total_price / number of orders for the clerk in that year.
      Only clerks with at least 100 orders in 1996 and at least 100 orders in 1997.
      avg_order_value_change = avg_order_value_1997 - avg_order_value_1996 (currency, not a ratio).
      Rank by avg_order_value_change descending; ties by clerk ascending. Top 10.
    columns: [clerk, avg_order_value_1996, avg_order_value_1997, avg_order_value_change]
    order_matters: true
    sql: |
      with y as (
        select o_clerk, year(o_orderdate) as yr, count(*) as n, sum(o_totalprice) / count(*) as aov
        from orders where o_orderdate between date '1996-01-01' and date '1997-12-31'
        group by 1, 2)
      select a.o_clerk as clerk, a.aov as avg_order_value_1996, b.aov as avg_order_value_1997,
             b.aov - a.aov as avg_order_value_change
      from y a join y b on a.o_clerk = b.o_clerk and a.yr = 1996 and b.yr = 1997
      where a.n >= 100 and b.n >= 100
      order by avg_order_value_change desc, clerk asc limit 10

  - id: B34
    domain: finance
    difficulty: hard
    persona: FP&A Manager
    decision: spotting regions whose quarterly momentum is fading
    question: >-
      For each customer region and each quarter of 1997, what was revenue and
      how did it compare with the same quarter of 1996?
    interpretation: |
      Revenue = sum of extended_price * (1 - discount), assigned by order_date.
      order_quarter = first day of the 1997 quarter (1997-01-01, 1997-04-01, 1997-07-01, 1997-10-01).
      revenue_yoy_growth = revenue in the 1997 quarter / revenue in the same quarter of 1996 - 1, as a fraction,
      per customer_region_name. 20 rows (5 regions x 4 quarters).
    columns: [customer_region_name, order_quarter, revenue, revenue_yoy_growth]
    order_matters: false
    sql: |
      with q as (
        select r_name, date_trunc('quarter', o_orderdate)::date as qtr,
               sum(l_extendedprice * (1 - l_discount)) as revenue
        from lineitem join orders on l_orderkey = o_orderkey join customer on o_custkey = c_custkey
        join nation on c_nationkey = n_nationkey join region on n_regionkey = r_regionkey
        where o_orderdate between date '1996-01-01' and date '1997-12-31'
        group by 1, 2)
      select a.r_name as customer_region_name, a.qtr as order_quarter, a.revenue,
             a.revenue / b.revenue - 1 as revenue_yoy_growth
      from q a join q b on a.r_name = b.r_name and b.qtr = a.qtr - interval 1 year
      where year(a.qtr) = 1997

