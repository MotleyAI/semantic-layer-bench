  - id: B41
    domain: marketing
    difficulty: medium
    persona: International Marketing Director
    decision: which countries to put growth marketing investment into
    question: >-
      Which 10 customer countries grew revenue the fastest from 1996 to 1997?
    interpretation: |
      Revenue = sum of extended_price * (1 - discount), assigned by order_date year, by customer_nation_name.
      revenue_growth = revenue_1997 / revenue_1996 - 1, as a fraction.
      Rank by revenue_growth descending; ties by customer_nation_name ascending. Top 10.
    columns: [customer_nation_name, revenue_1996, revenue_1997, revenue_growth]
    order_matters: true
    sql: |
      with n as (
        select n_name,
               sum(case when year(o_orderdate) = 1996 then l_extendedprice * (1 - l_discount) else 0 end) as r96,
               sum(case when year(o_orderdate) = 1997 then l_extendedprice * (1 - l_discount) else 0 end) as r97
        from lineitem join orders on l_orderkey = o_orderkey join customer on o_custkey = c_custkey
        join nation on c_nationkey = n_nationkey
        where o_orderdate between date '1996-01-01' and date '1997-12-31'
        group by 1)
      select n_name as customer_nation_name, r96 as revenue_1996, r97 as revenue_1997,
             r97 / r96 - 1 as revenue_growth
      from n order by revenue_growth desc, customer_nation_name asc limit 10

  - id: B42
