        where o_orderdate between date '1997-01-01' and date '1997-12-31'
        group by 1, 2),
      r as (select *, row_number() over (partition by r_name order by revenue desc, p_brand asc) as brand_rank from b)
      select r_name as customer_region_name, p_brand as brand, revenue, brand_rank
      from r where brand_rank <= 3 order by customer_region_name, brand_rank

  - id: B49
    domain: marketing
    difficulty: hard
    persona: Head of Customer Insights
    decision: defining loyalty tiers based on lifetime order frequency
    question: >-
      How are our customers distributed by lifetime number of orders, and how
      much revenue does each frequency band account for?
    interpretation: |
      All orders, full history (1992-01-01 to 1998-08-02). Only customers with at least one order.
      Lifetime order count per customer, bucketed as order_count_bucket labels:
      '1-9', '10-14', '15-19', '20-24', '25+'.
      customer_count = customers in the bucket; revenue = lifetime revenue (sum of extended_price * (1 - discount))
      of those customers. 5 rows.
    columns: [order_count_bucket, customer_count, revenue]
    order_matters: false
    sql: |
      with oc as (select o_custkey, count(*) as n from orders group by 1),
      rev as (
        select o_custkey, sum(l_extendedprice * (1 - l_discount)) as revenue
        from lineitem join orders on l_orderkey = o_orderkey group by 1)
      select case when n < 10 then '1-9' when n < 15 then '10-14' when n < 20 then '15-19'
                  when n < 25 then '20-24' else '25+' end as order_count_bucket,
             count(*) as customer_count, sum(rev.revenue) as revenue
      from oc join rev using (o_custkey)
      group by 1

  - id: B50
    domain: marketing
    difficulty: hard
    persona: Marketing Director
    decision: whether segment marketing spend should shift toward growing segments
    question: >-
      How has each segment's share of our revenue changed between 1993 and
      1997?
    interpretation: |
      Revenue = sum of extended_price * (1 - discount), year by order_date.
      revenue_share_1993 = segment revenue in 1993 / total 1993 revenue; revenue_share_1997 likewise for 1997
      (fractions). share_change = revenue_share_1997 - revenue_share_1993. One row per market_segment (5 rows).
    columns: [market_segment, revenue_share_1993, revenue_share_1997, share_change]
    order_matters: false
    sql: |
      with s as (
        select c_mktsegment, year(o_orderdate) as yr, sum(l_extendedprice * (1 - l_discount)) as revenue
        from lineitem join orders on l_orderkey = o_orderkey join customer on o_custkey = c_custkey
        where year(o_orderdate) in (1993, 1997)
        group by 1, 2),
      sh as (select *, revenue / sum(revenue) over (partition by yr) as share from s)
      select a.c_mktsegment as market_segment, a.share as revenue_share_1993, b.share as revenue_share_1997,
             b.share - a.share as share_change
      from sh a join sh b on a.c_mktsegment = b.c_mktsegment and a.yr = 1993 and b.yr = 1997
