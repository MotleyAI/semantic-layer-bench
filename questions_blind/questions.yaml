      Line items whose order has order_date between 1997-01-01 and 1997-12-31 inclusive.
      Negative-balance customer = customer account_balance < 0 (current value on the customer record).
      negative_balance_revenue_share = revenue from negative-balance customers / total revenue, per market_segment,
