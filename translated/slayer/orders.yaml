version: 8
name: orders
sql_table: tpch.main.orders
data_source: tpch
columns:
  - name: order_status
    sql: o_orderstatus
    type: TEXT
    description: F = fulfilled, O = open, P = partial
  - name: order_priority
    sql: o_orderpriority
    type: TEXT
    description: 1-URGENT .. 5-LOW
  - name: clerk
    sql: o_clerk
    type: TEXT
  - name: total_price
    sql: o_totalprice
    type: DOUBLE
    description: Order total as recorded on the order
  - name: order_key
    sql: o_orderkey
    type: INT
    primary_key: true
  - name: customer_key
    sql: o_custkey
    type: INT
  - name: order_date
    sql: o_orderdate
    type: DATE
    description: Date the order was placed
  - name: o_orderkey
    type: TEXT
    primary_key: true
    description: Number of orders
  - name: o_totalprice
    type: TEXT
    description: Sum of order total price
measures:
  - formula: o_orderkey:count
    name: order_count
    description: Number of orders
    type: INT
  - formula: o_totalprice:sum
    name: order_value
    description: Sum of order total price
  - formula: o_orderkey:count
    name: order_count
    description: Number of orders
  - formula: o_totalprice:sum
    name: order_value
    description: Sum of order total price
  - formula: o_totalprice:sum / o_orderkey:count
    name: avg_order_value
    description: Order value per order
joins:
  - target_model: customer
    join_pairs:
      - - o_custkey
        - c_custkey
    join_type: left
    description: 'Join name: orders_to_customer.'
description: One row per order
