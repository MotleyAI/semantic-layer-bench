version: 8
name: partsupp
sql_table: tpch.main.partsupp
data_source: tpch
columns:
  - name: available_qty
    sql: ps_availqty
    type: INT
  - name: supply_cost
    sql: ps_supplycost
    type: DOUBLE
    description: Cost of one unit from this supplier
  - name: ps_availqty
    type: TEXT
    description: Supply quantity available
measures:
  - formula: ps_availqty:sum
    name: total_available_qty
    description: Supply quantity available
  - formula: ps_availqty:sum
    name: total_available_qty
    description: Supply quantity available
joins:
  - target_model: part
    join_pairs:
      - - ps_partkey
        - p_partkey
    join_type: left
    description: 'Join name: partsupp_to_part.'
  - target_model: supplier
    join_pairs:
      - - ps_suppkey
        - s_suppkey
    join_type: left
    description: 'Join name: partsupp_to_supplier.'
description: One row per (part, supplier) offer; a second fact
